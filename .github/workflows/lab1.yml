name: C++ Release Build

on:
  push:
    branches:
      - main
      - feature/github_actions

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: macos-latest
            package_extension: dmg
          - os: ubuntu-latest
            package_extension: deb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -DPATCH_VERSION=${{ github.run_number }}
          -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build --config Release

      - name: Build package
        run: cmake --build build --target package --config Release

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-world-${{ runner.os }}
          path: build/*.${{ matrix.package_extension }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: |
            artifacts/hello-world-Linux/*.deb
            artifacts/hello-world-macOS/*.dmg

  run:
    name: Run C++ Application
    needs: build
    runs-on: ubuntu-latest

    steps:
      - run: ./build/hello-world